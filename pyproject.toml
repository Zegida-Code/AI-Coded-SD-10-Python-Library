[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pysd10"
version = "0.2.1"
description = "Python client for the Epson SD-10 spectrophotometer over Bluetooth LE (spectrum and L*a*b*)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["bleak>=0.21"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sd10 = "sd10.cli:main"

[tool.setuptools]
packages = ["sd10"]

[tool.setuptools.package-data]
sd10 = ["data/*.json", "py.typed"]
